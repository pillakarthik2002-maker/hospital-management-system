{%extends 'home.html'%}
{%block content%}
  <center> 
    <table border="2" cellpadding="10" width="98%" style="background-color: hwb(25 18% 2% / 0.941); color: #0b0c0d; font-weight: bold;">  
        <thead style="background-color: hwb(25 18% 2% / 0.941); color: #0b0c0d; font-weight: bold; text-align: center;">
            <th style="border:2px solid black;">Role</th>
            <th style="border:2px solid black;">Experience</th>
            <th style="border:2px solid black;">Current CTC</th>
            <th style="border:2px solid black;">Notice Period</th>
        </thead>
        {%for job in job_open_data%} 
        <tbody>
            <tr>
                <td style="border:2px solid  black;">{{job.role }}</td>
                 <td style="border:2px solid black;">{{job.experience}}</td>
                 <td style="border:2px solid black;">{{job.current_ctc }}</td>
                 <td style="border:2px solid black;">{{job.notice_period }}</td>
            </tr>
        </tbody> 
        {%endfor%}
    </table><br>
    <a href="/download"><button style="background-color: blue; color: aliceblue; padding:10px; width:250px; margin-bottom: 15px;margin-right:25px;">DOWNLOAD DATA</button></a>
    <a href="/job_open/"><button style="background-color: blue; color: aliceblue; padding:10px; width:250px; margin-bottom: 15px;margin-right:25px;">ADD JOB OPENING</button></a>
    
</center> 

{%endblock%}
