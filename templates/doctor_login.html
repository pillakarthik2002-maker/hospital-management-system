{% extends 'home.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow border-0">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <div style="
                            width:70px;
                            height:70px;
                            margin:auto;
                            border-radius:50%;
                            background:#E3F2FD;
                            color:#1565C0;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:30px;
                        ">

                            <i class="bi bi-person-badge"></i>

                        </div>

                        <h2 class="mt-3"
                            style="color:#0D47A1;font-weight:bold;">

                            Doctor Login

                        </h2>

                        <p class="text-muted">

                            Login to access your doctor dashboard

                        </p>

                    </div>


                    {% if message %}

                    <div class="alert alert-danger">

                        {{ message }}

                    </div>

                    {% endif %}


                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter username"
                                required
                            >

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter password"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn w-100"
                            style="
                                background:#1565C0;
                                color:white;
                                height:48px;
                                font-weight:bold;
                            "
                        >

                            <i class="bi bi-box-arrow-in-right"></i>

                            Login

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
