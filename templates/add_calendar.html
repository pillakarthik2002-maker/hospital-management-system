{% extends 'home.html' %}

{% block content %}

<center>

<h2 style="margin-top:35px;
           color:#0D47A1;
           font-family:Cambria;
           font-weight:bold;">
    Add Hospital Holiday
</h2>

<p style="font-size:17px;
          color:#555;
          font-family:Cambria;">
    Add official hospital holidays and important events.
</p>

<form method="POST"
      style="width:450px;
             padding:30px;
             background:white;
             border-radius:15px;
             box-shadow:0px 8px 20px rgba(0,0,0,0.2);
             margin-top:20px;
             text-align:left;">

    {% csrf_token %}

    <div style="margin-bottom:10px; margin-left: 50px;">
        <label style="font-weight:bold;
                      color:#0D47A1;
                      font-size:16px;">
            Holiday Title :
        </label><br><br>

        {{ form.title }}
    </div>

    <div style="margin-bottom:15px; margin-left: 125px;">
        <label style="font-weight:bold;
                      color:#0D47A1;
                      font-size:16px;
                       margin-left: 15px;">
            Holiday Date : 
        </label><br><br>

        {{ form.date }}
    </div>

    <button type="submit"
            style="width:100%;
                   height:48px;
                   background:linear-gradient(to right,#1565C0,#42A5F5);
                   color:white;
                   border:none;
                   border-radius:10px;
                   font-size:17px;
                   font-weight:bold;
                   cursor:pointer;">
        Add Holiday
    </button>

</form>

<br>

<a href="/doctor/" style="text-decoration:none;">
    <button type="button"
            style="width:170px;
                   height:45px;
                   background:linear-gradient(to right,#6C757D,#495057);
                   color:white;
                   border:none;
                   border-radius:10px;
                   font-size:16px;
                   font-weight:bold;
                   cursor:pointer;">
        ← Back
    </button>
</a>

</center>

{% endblock %}
