  {% extends 'home.html' %}

{% block content %}

<center>

    <h4 style="margin-top:30px;
               color:#0d6efd;
               font-weight:bold;
               font-family:Arial;">
        Review Form 
    </h4>

    <form method="POST"
          style="width:400px;
                 padding:30px;
                 background-color:#ffffff;
                 border:1px solid #dcdcdc;
                 border-radius:12px;
                 box-shadow:0px 0px 12px lightgray;
                 margin-top:20px;
                 text-align:left;">

        {% csrf_token %}

    <div style="margin-bottom:15px; margin-left: 40px;">
         <label style="font-weight:bold;">Patient Name:</label>
          {{ form.patient_name}}
    </div>

    <div style="margin-bottom:15px;margin-left: 40px; ">
        <label style="font-weight:bold;">Doctor Name:</label>
        {{ form.doctor_name }}
    </div>
    <div style="margin-bottom:15px; " >
        <label style="font-weight:bold;">Feedback</label>
         {{ form.feedback}}
    </div>
    <div style="margin-bottom:15px;" >
        <label style="font-weight:bold;">Rating :</label>
         {{ form.rating}}
    </div>
     <div style="margin-bottom:15px;" >
        <label style="font-weight:bold;">date :</label>
         {{ form.date}}
        <button type="submit"
                style="width:100%;
                       height:45px;
                       background-color:#0d6efd;
                       color:white;
                       border:none;
                       border-radius:8px;
                       font-size:17px;
                       font-weight:bold;
                       cursor:pointer;
                       margin-top:15px;">
            submit
        </button>

    </form>

</center>

{%endblock%}
