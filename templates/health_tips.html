{% extends 'home.html' %}

{% block content %}

<center>

    <h2 style="margin-top:30px;
               color:#0d6efd;
               font-family:Arial;
               font-weight:bold;">
        ADD HEALTH TIPS HERE
    </h2>

    <form method="POST"
          style="width:350px;
                 border:2px solid black;
                 padding:20px;
                 border-radius:10px;
                 background: white;
                 margin-top:20px;">

        {% csrf_token %}

        <div style="text-align:left; font-size:16px;">
            {{ form.as_p }}
        </div>

        <button type="submit"
                style="width:100%;
                       height:40px;
                       background-color:blue;
                       color:white;
                       border:none;
                       border-radius:5px;
                       font-size:16px;
                       font-weight:bold;">
            Publish health tip
        </button>

    </form>

</center>

{% endblock %}
