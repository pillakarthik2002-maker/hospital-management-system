
{% extends 'home.html' %}

{% block content %}

<center>

<div style="width:600px;

            box-shadow:0px 8px 20px rgba(0,0,0,0.2);">

    <h1 style="color:#28A745;

    &nbsp;&nbsp;

    <a href="/patient/">

                       font-weight:bold;
