{% extends 'home.html' %}

{% block content %}

<center>

    <h3 style="margin-top:30px; color:darkblue;">
        Update Health Campaign Form
    </h3>

    <form method="POST"
          style="width:350px;
                 border:2px solid black;
                 padding:20px;
                 border-radius:10px;
                 background-color:#f5f5f5;
                 margin-top:20px;">

        {% csrf_token %}

        <div style="text-align:left; font-size:16px;">
            {{ form.as_p }}
        </div>

        <button type="submit"
                style="width:100%;
                       height:40px;
                       background-color:blue;
                       color:white;
                       border:none;
                       border-radius:5px;
                       font-size:16px;
                       font-weight:bold;">
            Submit
        </button>

    </form>

    <button><a href="/health_campaign_data/" style="text-decoration: none; color: white;">Back to Health Campaign Data</a></button>

</center>

{% endblock %}
