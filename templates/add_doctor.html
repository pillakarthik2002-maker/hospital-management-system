{% extends 'home.html' %}

{% block content %}

<center>

<h2 style="margin-top:30px;
           color:#0D47A1;
           font-family:Cambria;
           font-weight:bold;">
    ADD DOCTOR
</h2>

<form method="POST"
      style="width:450px;
             margin-top:20px;
             background:white;
             padding:30px;
             border-radius:15px;
             box-shadow:0px 8px 20px rgba(0,0,0,0.2);">

    {% csrf_token %}
     <div style="margin-bottom:15px;" >
        <label style="font-weight:bold;">Doctor Name:</label>
         {{ form.name}}
    </div>
     <div style="margin-bottom:15px;" >
        <label style="font-weight:bold;">Specialization:</label>
         {{ form.specialization}}
    </div>
     <div style="margin-bottom:15px;" >
        <label style="font-weight:bold; margin-left:15px; "> Enter Email:</label>
         {{ form.email}}
    </div>
    <div style="margin-bottom:15px;" >
        <label style="font-weight:bold;">Phone-Number</label>
         {{ form.phone_number}}
    </div>

    <button type="submit"
            style="width:100%;
                   height:45px;
                   background:linear-gradient(to right,#1565C0,#42A5F5);
                   color:white;
                   border:none;
                   border-radius:8px;
                   font-size:17px;
                   font-weight:bold;
                   cursor:pointer;">
        ADD DOCTOR
    </button>

</form>

<br>

<a href="/doctor/" style="text-decoration:none;">
    <button type="button"
            style="width:150px;
                   height:45px;
                   background:linear-gradient(to right,#6C757D,#495057);
                   color:white;
                   border:none;
                   border-radius:8px;
                   font-size:16px;
                   font-weight:bold;
                   cursor:pointer;">
        ← Back
    </button>
</a>

</center>

{% endblock %}
